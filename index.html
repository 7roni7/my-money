<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ניהול מעטפות - רוני ובתאל</title>
  
  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- React & Firebase CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Firebase App & Firestore -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap');
    
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --text: #0f172a;
      --text-muted: #64748b;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
      --purple: #8b5cf6;
    }

    * {
      font-family: 'Assistant', sans-serif;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      direction: rtl;
      padding: 16px;
      max-width: 800px;
      margin: 0 auto;
      min-height: 100vh;
    }

    /* Modal Backdrop & X Button Fix */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-content {
      background: #ffffff;
      border-radius: 20px;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    .close-btn-fixed {
      position: absolute;
      top: 16px;
      left: 16px;
      background: #f1f5f9;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: bold;
      color: #64748b;
      font-size: 18px;
      transition: all 0.2s;
      z-index: 10;
    }

    .close-btn-fixed:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    /* Badge Style for Installments */
    .badge-purple {
      background-color: #f3e8ff;
      color: #6b21a8;
      border: 1px solid #d8b4fe;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      display: inline-block;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }

    .btn {
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.2s;
    }
    
    .btn:active { opacity: 0.8; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-success { background: #10b981; color: white; }
    .btn-warning { background: #f59e0b; color: white; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-purple { background: #8b5cf6; color: white; }

    input, select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      margin-top: 4px;
      margin-bottom: 12px;
    }

    .export-menu {
      position: absolute;
      top: 100%;
      right: 0;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 50;
      min-width: 160px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Firebase Config (Replace with your operational credentials if required)
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyForBudgetApp",
      authDomain: "my-money-app.firebaseapp.com",
      projectId: "my-money-app",
      storageBucket: "my-money-app.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // Helper: Extract Installment Data (e.g., POTENAM 01/02)
    function parseInstallment(desc) {
      if (!desc) return null;
      const regex = /(?:תשלום|עסקה)?\s*(\d{1,2})\s*(?:מתוך|\/|-)\s*(\d{1,2})/i;
      const match = desc.match(regex);
      if (match) {
        return {
          current: parseInt(match[1]),
          total: parseInt(match[2])
        };
      }
      return null;
    }

    function App() {
      const [currentMonth, setCurrentMonth] = useState("2026-10");
      const [envelopes, setEnvelopes] = useState([
        { id: "var", name: "משתנות", budget: 5500, isShonot: false },
        { id: "unforeseen", name: "בלת\"מים", budget: 4300, isShonot: false },
        { id: "events", name: "אירועים וביקורים", budget: 1500, isShonot: false },
        { id: "shonot", name: "שונות (חיוב מחיסכון)", budget: 3000, isShonot: true }
      ]);
      const [transactions, setTransactions] = useState([]);
      const [activeEnvelope, setActiveEnvelope] = useState(null);
      const [showPieChart, setShowPieChart] = useState(false);
      const [showExportMenu, setShowExportMenu] = useState(false);
      const [showForecastModal, setShowForecastModal] = useState(false);
      
      // Form States
      const [manualTx, setManualTx] = useState({ desc: "", amount: "", envelopeId: "var", category: "", note: "" });

      useEffect(() => {
        // Load stored transactions
        const unsubscribe = db.collection("transactions")
          .where("month", "==", currentMonth)
          .onSnapshot(snapshot => {
            const txs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setTransactions(txs);
          }, err => {
            console.log("Firestore offline/fallback", err);
          });
        return () => unsubscribe();
      }, [currentMonth]);

      // Net Calculation excluding "Shonot" (Savings funded)
      const totalIncome = 20000;
      const regularExpenses = transactions
        .filter(t => {
          const env = envelopes.find(e => e.id === t.envelopeId);
          return env && !env.isShonot;
        })
        .reduce((sum, t) => sum + (parseFloat(t.amount) || 0), 0);

      const netDifference = totalIncome - regularExpenses;

      const handleAddManualTx = () => {
        if (!manualTx.desc || !manualTx.amount) return;
        const newTx = {
          ...manualTx,
          amount: parseFloat(manualTx.amount),
          month: currentMonth,
          date: new Date().toISOString().split('T')[0]
        };
        db.collection("transactions").add(newTx);
        setManualTx({ desc: "", amount: "", envelopeId: "var", category: "", note: "" });
        setShowForecastModal(false);
      };

      // Export to Excel
      const exportToExcel = () => {
        const data = transactions.map(t => ({
          "תיאור": t.desc,
          "סכום": t.amount,
          "מעטפה": envelopes.find(e => e.id === t.envelopeId)?.name || "",
          "קטגוריה": t.category || "",
          "הערה": t.note || "",
          "תאריך": t.date || ""
        }));
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "דוח חודשי");
        XLSX.writeFile(wb, `דוח_תקציב_${currentMonth}.xlsx`);
        setShowExportMenu(false);
      };

      // Export to PDF
      const exportToPDF = () => {
        const element = document.getElementById("pdf-report-content");
        const opt = {
          margin: 10,
          filename: `דוח_תקציב_${currentMonth}.pdf`,
          html2canvas: { scale: 2 },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
        setShowExportMenu(false);
      };

      return (
        <div>
          {/* Top Status Header */}
          <div style={{ background: "#dcfce7", color: "#166534", padding: "12px 16px", borderRadius: "14px", display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "16px", fontWeight: "700" }}>
            <span>✓ מחובר: רוני ולרי</span>
            <button className="btn" style={{ background: "#2563eb", color: "white", padding: "6px 12px", fontSize: "13px" }}>התנתק</button>
          </div>

          {/* User Greeting & Date Controls */}
          <div className="card">
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "12px" }}>
              <div style={{ display: "flex", alignItems: "center", gap: "8px", background: "#f1f5f9", padding: "6px 12px", borderRadius: "10px" }}>
                <button onClick={() => setCurrentMonth("2026-09")} style={{ border: "none", background: "none", cursor: "pointer" }}>◄</button>
                <span style={{ fontWeight: "800", color: "#1e40af" }}>אוקטובר 2026</span>
                <button onClick={() => setCurrentMonth("2026-11")} style={{ border: "none", background: "none", cursor: "pointer" }}>►</button>
              </div>
              <h2 style={{ fontSize: "20px", fontWeight: "800" }}>שלום, רוני 👋</h2>
            </div>

            {/* Net Calculation Summary */}
            <div style={{ background: "#0f172a", color: "white", padding: "16px", borderRadius: "12px", marginTop: "12px" }}>
              <div style={{ fontSize: "12px", color: "#94a3b8" }}>הפרש נטו (הכנסות פחות הוצאות שוטפות)</div>
              <div style={{ fontSize: "28px", fontWeight: "800", color: "#34d399", margin: "4px 0" }}>₪{netDifference.toLocaleString()}</div>
              <div style={{ fontSize: "11px", color: "#cbd5e1" }}>* מעטפת "שונות (חיוב מחיסכון)" מוחרגת מחישוב הנטו מכיוון שהיא ממומנת מקופת חיסכון ייעודית.</div>
            </div>
          </div>

          {/* Action Buttons */}
          <div style={{ display: "flex", gap: "10px", marginBottom: "20px", position: "relative" }}>
            <button className="btn btn-primary" style={{ flex: 1, justifyContent: "center" }}>📁 טעינת דפי מידע</button>
            <button className="btn btn-warning" style={{ flex: 1, justifyContent: "center" }} onClick={() => setShowForecastModal(true)}>+ צפי/בדיקה</button>
            
            <div style={{ flex: 1, position: "relative" }}>
              <button className="btn btn-success" style={{ width: "100%", justifyContent: "center" }} onClick={() => setShowExportMenu(!showExportMenu)}>
                ייצוא נתונים 📤
              </button>
              {showExportMenu && (
                <div className="export-menu">
                  <button className="btn" style={{ background: "#f8fafc", color: "#0f172a", justifyContent: "flex-start" }} onClick={exportToExcel}>📊 ייצוא ל-Excel</button>
                  <button className="btn" style={{ background: "#f8fafc", color: "#0f172a", justifyContent: "flex-start" }} onClick={exportToPDF}>📄 ייצוא ל-PDF</button>
                </div>
              )}
            </div>
          </div>

          {/* Envelope Section Title */}
          <h3 style={{ fontSize: "18px", fontWeight: "800", marginBottom: "12px" }}>מעטפות משתנות ותקציביות</h3>

          {/* Envelopes List */}
          {envelopes.map(env => {
            const envTxs = transactions.filter(t => t.envelopeId === env.id);
            const spent = envTxs.reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);
            const remaining = env.budget - spent;

            return (
              <div key={env.id} className="card" style={{ cursor: "pointer", position: "relative" }} onClick={() => setActiveEnvelope(env)}>
                {env.isShonot && (
                  <span style={{ position: "absolute", top: "12px", right: "12px", background: "#f59e0b", color: "white", fontSize: "10px", padding: "2px 6px", borderRadius: "6px", fontWeight: "700" }}>
                    חיוב מחיסכון
                  </span>
                )}
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "8px" }}>
                  <button className="btn" style={{ background: "#f1f5f9", color: "#475569", padding: "4px 8px", fontSize: "12px" }}>✏️ ערוך</button>
                  <h4 style={{ fontSize: "18px", fontWeight: "700" }}>{env.name}</h4>
                </div>

                <div style={{ display: "flex", justifyContent: "space-between", fontSize: "14px", color: "#64748b", margin: "6px 0" }}>
                  <span>יצא: ₪{spent.toLocaleString()} מתוך ₪{env.budget.toLocaleString()}</span>
                  <span>נשאר: ₪{remaining.toLocaleString()}</span>
                </div>

                <div style={{ background: "#e2e8f0", height: "8px", borderRadius: "4px", overflow: "hidden" }}>
                  <div style={{ background: remaining < 0 ? "#ef4444" : "#2563eb", width: `${Math.min(100, (spent / env.budget) * 100)}%`, height: "100%" }}></div>
                </div>
              </div>
            );
          })}

          {/* Active Envelope Detail Modal */}
          {activeEnvelope && (
            <div className="modal-backdrop">
              <div className="modal-content">
                <button className="close-btn-fixed" onClick={() => { setActiveEnvelope(null); setShowPieChart(false); }}>✕</button>
                
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "16px", marginTop: "10px" }}>
                  <button className="btn btn-purple" style={{ padding: "6px 12px", fontSize: "12px" }} onClick={() => setShowPieChart(!showPieChart)}>
                    📊 {showPieChart ? "הצג רשימה" : "הצג התפלגות פאי"}
                  </button>
                  <h3 style={{ fontSize: "20px", fontWeight: "800" }}>מעטפת {activeEnvelope.name}</h3>
                </div>

                {showPieChart ? (
                  <div style={{ padding: "20px", textAliing: "center", color: "#64748b" }}>
                    <p>[תרשים התפלגות קטגוריות עבור מעטפת {activeEnvelope.name}]</p>
                  </div>
                ) : (
                  <div>
                    <h4 style={{ fontSize: "15px", fontWeight: "700", marginBottom: "10px" }}>הוצאות במעטפת (מהחדש לישן):</h4>
                    {transactions
                      .filter(t => t.envelopeId === activeEnvelope.id)
                      .reverse() // Sort newest first
                      .map((t, idx) => {
                        const inst = parseInstallment(t.desc);
                        return (
                          <div key={idx} style={{ borderBottom: "1px solid #f1f5f9", padding: "10px 0", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                            <div>
                              <div style={{ fontWeight: "700", fontSize: "15px" }}>
                                {t.desc}
                                {inst && (
                                  <span className="badge-purple" style={{ marginRight: "8px" }}>
                                    תשלום {inst.current} מתוך {inst.total}
                                  </span>
                                )}
                              </div>
                              <div style={{ fontSize: "12px", color: "#64748b" }}>
                                {t.date || "2026-10-22"} • קטגוריה: <span style={{ color: "#2563eb", fontWeight: "600" }}>{t.category || "כללי"}</span>
                              </div>
                              {t.note && <div style={{ fontSize: "12px", color: "#d97706", marginTop: "2px" }}>💡 {t.note}</div>}
                            </div>
                            <div style={{ fontWeight: "800", fontSize: "16px", color: "#0f172a" }}>
                              ₪{parseFloat(t.amount).toLocaleString()}
                            </div>
                          </div>
                        );
                      })}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Forecast / Add Transaction Modal */}
          {showForecastModal && (
            <div className="modal-backdrop">
              <div className="modal-content">
                <button className="close-btn-fixed" onClick={() => setShowForecastModal(false)}>✕</button>
                <h3 style={{ fontSize: "18px", fontWeight: "800", marginBottom: "16px" }}>הוספת עסקה / צפי הוצאה</h3>

                <label style={{ fontSize: "13px", fontWeight: "700" }}>תיאור העסקה</label>
                <input type="text" value={manualTx.desc} onChange={e => setManualTx({ ...manualTx, desc: e.target.value })} placeholder="דוגמה: מקס רחובות (תשלום 1 מתוך 3)" />

                <label style={{ fontSize: "13px", fontWeight: "700" }}>סכום (₪)</label>
                <input type="number" value={manualTx.amount} onChange={e => setManualTx({ ...manualTx, amount: e.target.value })} placeholder="0.00" />

                <label style={{ fontSize: "13px", fontWeight: "700" }}>שיוך למעטפה</label>
                <select value={manualTx.envelopeId} onChange={e => setManualTx({ ...manualTx, envelopeId: e.target.value })}>
                  {envelopes.map(env => (
                    <option key={env.id} value={env.id}>{env.name}</option>
                  ))}
                </select>

                <label style={{ fontSize: "13px", fontWeight: "700" }}>קטגוריה</label>
                <input type="text" value={manualTx.category} onChange={e => setManualTx({ ...manualTx, category: e.target.value })} placeholder="דוגמה: חשמל, קוסמטיקה..." />

                <label style={{ fontSize: "13px", fontWeight: "700" }}>הערה חופשית</label>
                <input type="text" value={manualTx.note} onChange={e => setManualTx({ ...manualTx, note: e.target.value })} placeholder="פירוט נוסף..." />

                <button className="btn btn-primary" style={{ width: "100%", justifyContent: "center", marginTop: "10px" }} onClick={handleAddManualTx}>
                  שמור עסקה
                </button>
              </div>
            </div>
          )}

          {/* Invisible Container for PDF Export */}
          <div id="pdf-report-content" style={{ display: "none" }}>
            <h2>דוח תקציב חודשי - {currentMonth}</h2>
            <p>הכנסות: ₪{totalIncome}</p>
            <p>הוצאות שוטפות: ₪{regularExpenses}</p>
            <p>הפרש נטו: ₪{netDifference}</p>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
