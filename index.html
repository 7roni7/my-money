<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ניהול מעטפות - רוני ובתאל</title>
  
  <!-- External Libraries (CDNs) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & Firebase Scripts -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap');
    
    * {
      font-family: 'Assistant', sans-serif;
      box-sizing: border-box;
    }
    body {
      background-color: #f8fafc;
      color: #0f172a;
      direction: rtl;
    }
    .modal-backdrop {
      background-color: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
    }
    .pdf-export-container * {
      letter-spacing: normal !important;
      word-spacing: normal !important;
    }
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div id="root"></div>

<!-- MAIN APPLICATION LOGIC -->
<script type="text/babel">
  const { useState, useEffect, useMemo, useRef } = React;

  // Global Categories Options
  const DEFAULT_CATEGORIES = [
    "מזון וסופר", "חשמל ומחשבים", "קוסמטיקה וטיפוח", "מסעדות ובתי קפה", 
    "דלק ותחבורה", "קניות לבית", "בריאות ורפואה", "ילדים וחינוך", "ביגוד והנעלה", "שונות"
  ];

  // Helper: Extract Installments from Merchant or Text
  function parseInstallmentData(rawText, rawAmount) {
    if (!rawText) return { isInstallment: false, current: 1, total: 1 };
    
    const text = String(rawText);
    // Pattern 1: תשלום X מתוך Y or X/Y
    const match1 = text.match(/(?:תשלום|ת'|תש')?\s*(\d{1,2})\s*(?:מתוך|\/|-)\s*(\d{1,2})/i);
    if (match1) {
      const current = parseInt(match1[1], 10);
      const total = parseInt(match1[2], 10);
      if (total > 1 && current <= total) {
        return { isInstallment: true, current, total };
      }
    }
    return { isInstallment: false, current: 1, total: 1 };
  }

  // Helper: Format Currency
  function formatILS(val) {
    return new Intl.NumberFormat('he-IL', { style: 'currency', currency: 'ILS', maximumFractionDigits: 0 }).format(val || 0);
  }

  function App() {
    // Current Active Month/Year State
    const [currentDate, setCurrentDate] = useState(() => {
      const now = new Date();
      return { year: now.getFullYear(), month: now.getMonth() + 1 };
    });

    const currentYM = `${currentDate.year}-${String(currentDate.month).padStart(2, '0')}`;

    // App Main States
    const [user, setUser] = useState({ name: "רוני ורלי", email: "7roni7@gmail.com" });
    const [envelopes, setEnvelopes] = useState([
      { id: "e1", name: "משתנות", budget: 5500, isSavings: false },
      { id: "e2", name: "בלת\"ם", budget: 4300, isSavings: false },
      { id: "e3", name: "שונות (חיוב מחיסכון)", budget: 3000, isSavings: true },
      { id: "e4", name: "אירועים ובילויים", budget: 1500, isSavings: false }
    ]);

    const [transactions, setTransactions] = useState([
      {
        id: "t1",
        merchant: "POTENAM",
        amount: 490,
        date: "2026-10-22",
        envelopeId: "e1",
        category: "קוסמטיקה וטיפוח",
        note: "טיפול פנים",
        yearMonth: "2026-10",
        isInstallment: true,
        currentInstallment: 1,
        totalInstallments: 2,
        card: "Pepper"
      },
      {
        id: "t2",
        merchant: "מקס רחובות בע\"מ",
        amount: 37.7,
        date: "2026-10-23",
        envelopeId: "e1",
        category: "חשמל ומחשבים",
        note: "",
        yearMonth: "2026-10",
        isInstallment: false,
        currentInstallment: 1,
        totalInstallments: 1,
        card: "Pepper"
      },
      {
        id: "t3",
        merchant: "ד\"ר שאלתיאל",
        amount: 850,
        date: "2026-10-15",
        envelopeId: "e3",
        category: "בריאות ורפואה",
        note: "טיפול שיניים חירום",
        yearMonth: "2026-10",
        isInstallment: true,
        currentInstallment: 1,
        totalInstallments: 3,
        card: "מקס"
      }
    ]);

    const [income, setIncome] = useState(20000);
    const [selectedEnvelope, setSelectedEnvelope] = useState(null);
    const [showExportModal, setShowExportModal] = useState(false);
    const [showForecastModal, setShowForecastModal] = useState(false);
    const [searchTerm, setSearchTerm] = useState("");
    const [showChartModal, setShowChartModal] = useState(false);

    // New Transaction Form State for Manual Add / Forecast
    const [forecastForm, setForecastForm] = useState({
      merchant: "",
      amount: "",
      envelopeId: "e1",
      category: "משתנות",
      note: "",
      date: new Date().toISOString().split('T')[0]
    });

    // 13. Auto-Forecast Generation for Future Installments
    const allFilteredTransactions = useMemo(() => {
      let result = [...transactions];
      
      // Generate forecasts for future installment months
      transactions.forEach(txn => {
        if (txn.isInstallment && txn.currentInstallment < txn.totalInstallments) {
          const remaining = txn.totalInstallments - txn.currentInstallment;
          const [origY, origM] = txn.yearMonth.split('-').map(Number);

          for (let i = 1; i <= remaining; i++) {
            let nextM = origM + i;
            let nextY = origY;
            while (nextM > 12) {
              nextM -= 12;
              nextY += 1;
            }
            const forecastYM = `${nextY}-${String(nextM).padStart(2, '0')}`;
            
            // Only push if not already present in that month
            if (forecastYM === currentYM) {
              result.push({
                ...txn,
                id: `forecast_${txn.id}_${i}`,
                currentInstallment: txn.currentInstallment + i,
                yearMonth: forecastYM,
                isForecast: true
              });
            }
          }
        }
      });

      return result.filter(t => t.yearMonth === currentYM);
    }, [transactions, currentYM]);

    // 12. Reverse Sorting (Newest First) inside envelope view
    const sortedCurrentTransactions = useMemo(() => {
      return [...allFilteredTransactions].sort((a, b) => new Date(b.date) - new Date(a.date));
    }, [allFilteredTransactions]);

    // 3. Exclude "שונות (חיוב מחיסכון)" from Net Balance Calculation
    const netCalculation = useMemo(() => {
      const regularExpenses = sortedCurrentTransactions
        .filter(t => {
          const env = envelopes.find(e => e.id === t.envelopeId);
          return env && !env.isSavings; // Exclude savings-funded envelope
        })
        .reduce((sum, t) => sum + Number(t.amount || 0), 0);

      const netDifference = income - regularExpenses;
      return { regularExpenses, netDifference };
    }, [sortedCurrentTransactions, income, envelopes]);

    // Handle Excel File Import with automatic Month/Year recognition (Req 13)
    const handleFileUpload = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const bstr = evt.target.result;
          const wb = XLSX.read(bstr, { type: 'binary' });
          const wsname = wb.SheetNames[0];
          const ws = wb.Sheets[wsname];
          const data = XLSX.utils.sheet_to_json(ws, { header: 1 });

          const newParsedTxns = [];
          
          data.slice(1).forEach((row, idx) => {
            if (!row || row.length < 2) return;
            
            const rawMerchant = row[1] || row[0] || "עסקה כללית";
            const rawAmount = Math.abs(parseFloat(row[2] || row[3] || 0));
            const rawDate = row[0] || new Date().toISOString().split('T')[0];
            
            // Extract Month & Year from Date string
            let txnDate = new Date();
            if (typeof rawDate === 'string' && rawDate.includes('-')) {
              txnDate = new Date(rawDate);
            }
            const y = txnDate.getFullYear() || currentDate.year;
            const m = String((txnDate.getMonth() + 1) || currentDate.month).padStart(2, '0');
            const calculatedYM = `${y}-${m}`;

            // Parse Installments (Req 1)
            const instData = parseInstallmentData(rawMerchant, rawAmount);

            if (rawAmount > 0) {
              newParsedTxns.push({
                id: `excel_${Date.now()}_${idx}`,
                merchant: String(rawMerchant).replace(/(תשלום\s*\d+.*|\d+\/\d+)/g, '').trim(),
                amount: rawAmount,
                date: txnDate.toISOString().split('T')[0],
                envelopeId: "e1",
                category: "משתנות",
                note: "יובא מאקסל",
                yearMonth: calculatedYM,
                isInstallment: instData.isInstallment,
                currentInstallment: instData.current,
                totalInstallments: instData.total,
                card: "כרטיס אשראי"
              });
            }
          });

          setTransactions(prev => [...prev, ...newParsedTxns]);
          alert(`יובאו בהצלחה ${newParsedTxns.length} עסקאות מקובץ האקסל!`);
        } catch (err) {
          alert("שגיאה בטעינת קובץ האקסל: " + err.message);
        }
      };
      reader.readAsBinaryString(file);
    };

    // 8. Update Envelope Budget from this month forward
    const handleUpdateEnvelopeBudget = (envId, newBudget) => {
      setEnvelopes(prev => prev.map(e => e.id === envId ? { ...e, budget: Number(newBudget) } : e));
    };

    // 10. Update Transaction Category / Note inside Envelope
    const handleUpdateTxnField = (txnId, field, value) => {
      setTransactions(prev => prev.map(t => t.id === txnId ? { ...t, [field]: value } : t));
    };

    // Navigation Months
    const changeMonth = (delta) => {
      setCurrentDate(prev => {
        let newM = prev.month + delta;
        let newY = prev.year;
        if (newM > 12) { newM = 1; newY += 1; }
        if (newM < 1) { newM = 12; newY -= 1; }
        return { year: newY, month: newM };
      });
    };

    // 7. Render Chart for Category Breakdown
    useEffect(() => {
      if (showChartModal && selectedEnvelope) {
        const envTxns = sortedCurrentTransactions.filter(t => t.envelopeId === selectedEnvelope.id);
        const categoryTotals = {};
        envTxns.forEach(t => {
          categoryTotals[t.category || 'שונות'] = (categoryTotals[t.category || 'שונות'] || 0) + Number(t.amount);
        });

        const ctx = document.getElementById('categoryPieChart');
        if (ctx) {
          new Chart(ctx, {
            type: 'pie',
            data: {
              labels: Object.keys(categoryTotals),
              datasets: [{
                data: Object.values(categoryTotals),
                backgroundColor: ['#3b82f6', '#8b5cf6', '#ec4899', '#10b981', '#f59e0b', '#6366f1']
              }]
            },
            options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
          });
        }
      }
    }, [showChartModal, selectedEnvelope, sortedCurrentTransactions]);

    return (
      <div className="max-w-4xl mx-auto p-4 pb-20">
        
        {/* Top Header & Status */}
        <header className="flex justify-between items-center bg-emerald-50 border border-emerald-200 p-3 rounded-2xl mb-4">
          <div className="flex items-center gap-2 text-emerald-800 font-bold text-sm">
            <span className="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-ping"></span>
            מחובר: {user.name}
          </div>
          <button onClick={() => alert("התנתקת בהצלחה")} className="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1.5 rounded-xl transition">
            התנתק
          </button>
        </header>

        {/* Month Selector & Overview Card */}
        <div className="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm mb-6">
          <div className="flex justify-between items-center mb-4">
            <div className="flex items-center gap-2">
              <button onClick={() => changeMonth(-1)} className="bg-slate-100 p-2 rounded-xl text-slate-600 hover:bg-slate-200">◄</button>
              <span className="text-lg font-extrabold text-blue-900 px-3 py-1 bg-blue-50 rounded-xl">
                {currentDate.month === 10 ? "אוקטובר" : currentDate.month === 11 ? "נובמבר" : "חודש " + currentDate.month} {currentDate.year}
              </span>
              <button onClick={() => changeMonth(1)} className="bg-slate-100 p-2 rounded-xl text-slate-600 hover:bg-slate-200">►</button>
            </div>
            <h1 className="text-xl font-black text-slate-800">שלום, רוני 👋</h1>
          </div>

          {/* 3. Net Calculation Indicator */}
          <div className="bg-gradient-to-r from-slate-900 to-blue-950 text-white p-5 rounded-2xl shadow-inner">
            <div className="flex justify-between items-end mb-2">
              <div>
                <div className="text-xs text-slate-400 font-semibold mb-1">הפרש נטו (הכנסות פחות הוצאות שוטפות)</div>
                <div className="text-3xl font-black text-emerald-400">
                  {formatILS(netCalculation.netDifference)}
                </div>
              </div>
              <div className="text-left text-xs text-slate-300">
                <div>הכנסות: {formatILS(income)}</div>
                <div>הוצאות שוטפות: {formatILS(netCalculation.regularExpenses)}</div>
              </div>
            </div>
            <div className="text-[11px] text-amber-300/90 border-t border-slate-800 pt-2 mt-2">
              * מעטפת "שונות (חיוב מחיסכון)" מוחרגת מחישוב הנטו מכיוון שהיא ממומנת מקופת חיסכון ייעודית.
            </div>
          </div>
        </div>

        {/* Search Bar */}
        <div className="relative mb-6">
          <input
            type="text"
            placeholder="חפש עסקה לפי שם בית עסק..."
            value={searchTerm}
            onChange={(e) => setSearchTerm(e.target.value)}
            className="w-full bg-white border border-slate-200 rounded-2xl py-3 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm"
          />
        </div>

        {/* Action Buttons Row */}
        <div className="grid grid-cols-2 md:grid-cols-3 gap-3 mb-8">
          {/* 6. Unified Export Button */}
          <button 
            onClick={() => setShowExportModal(true)}
            className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold p-3.5 rounded-2xl flex items-center justify-center gap-2 shadow-sm text-sm transition"
          >
            <span>ייצוא נתונים 📤</span>
          </button>

          {/* 4. Forecast / Check Button */}
          <button 
            onClick={() => setShowForecastModal(true)}
            className="bg-amber-500 hover:bg-amber-600 text-white font-bold p-3.5 rounded-2xl flex items-center justify-center gap-2 shadow-sm text-sm transition"
          >
            <span>+ צפי / בדיקה</span>
          </button>

          {/* Excel Import */}
          <label className="bg-blue-600 hover:bg-blue-700 text-white font-bold p-3.5 rounded-2xl flex items-center justify-center gap-2 shadow-sm text-sm cursor-pointer transition col-span-2 md:col-span-1">
            <span>טעינת דפי מידע 📂</span>
            <input type="file" accept=".xlsx, .xls, .csv" onChange={handleFileUpload} className="hidden" />
          </label>
        </div>

        {/* Envelopes Grid */}
        <div className="mb-6">
          <h2 className="text-lg font-bold text-slate-800 mb-4">מעטפות משתנות ותקציביות</h2>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {envelopes.map(env => {
              const envTxns = sortedCurrentTransactions.filter(t => t.envelopeId === env.id);
              const spent = envTxns.reduce((sum, t) => sum + Number(t.amount || 0), 0);
              const remaining = env.budget - spent;

              return (
                <div 
                  key={env.id}
                  onClick={() => setSelectedEnvelope(env)}
                  className="bg-white border border-slate-200 rounded-2xl p-5 hover:border-blue-400 cursor-pointer transition shadow-sm relative overflow-hidden"
                >
                  {env.isSavings && (
                    <span className="absolute top-0 left-0 bg-amber-500 text-white text-[10px] px-3 py-0.5 rounded-br-xl font-bold">
                      חיוב מחיסכון
                    </span>
                  )}
                  <div className="flex justify-between items-start mb-3">
                    <div>
                      <h3 className="font-extrabold text-slate-800 text-base">{env.name}</h3>
                      {/* 11. Detailed Header: Spent out of Budget */}
                      <div className="text-xs text-slate-500 font-semibold mt-1">
                        יצא: <span className="text-slate-900 font-bold">{formatILS(spent)}</span> מתוך {formatILS(env.budget)}
                      </div>
                    </div>
                    <button 
                      onClick={(e) => {
                        e.stopPropagation();
                        const newB = prompt(`עדכן תקציב עבור ${env.name}:`, env.budget);
                        if (newB) handleUpdateEnvelopeBudget(env.id, newB);
                      }}
                      className="text-xs text-blue-600 bg-blue-50 px-2 py-1 rounded-lg font-semibold hover:bg-blue-100"
                    >
                      ערוך ✏️
                    </button>
                  </div>

                  {/* Progress Bar */}
                  <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden mb-2">
                    <div 
                      className={`h-full ${remaining < 0 ? 'bg-red-500' : 'bg-blue-600'}`}
                      style={{ width: `${Math.min(100, (spent / (env.budget || 1)) * 100)}%` }}
                    ></div>
                  </div>

                  <div className="flex justify-between items-center text-xs">
                    <span className="text-slate-500">נשאר: <strong className={remaining < 0 ? 'text-red-600' : 'text-emerald-600'}>{formatILS(remaining)}</strong></span>
                    <span className="text-slate-400 font-medium">{envTxns.length} עסקאות</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* 2 & 9 & 10 & 12. ENVELOPE MODAL (Detailed View) */}
        {selectedEnvelope && (
          <div className="fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl w-full max-w-2xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden relative">
              
              {/* Modal Header */}
              <div className="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <div>
                  <h3 className="text-xl font-black text-slate-800">{selectedEnvelope.name}</h3>
                  <p className="text-xs text-slate-500">
                    יצא: {formatILS(sortedCurrentTransactions.filter(t => t.envelopeId === selectedEnvelope.id).reduce((s,t)=>s+Number(t.amount),0))} מתוך {formatILS(selectedEnvelope.budget)}
                  </p>
                </div>
                
                <div className="flex items-center gap-2">
                  {/* 9. Pie Chart Button */}
                  <button 
                    onClick={() => setShowChartModal(true)}
                    className="p-2 bg-purple-100 text-purple-700 rounded-xl hover:bg-purple-200 text-xs font-bold flex items-center gap-1"
                  >
                    📊 התפלגות
                  </button>

                  {/* 2. Prominent Close (X) Button */}
                  <button 
                    onClick={() => setSelectedEnvelope(null)}
                    className="w-9 h-9 bg-slate-200 hover:bg-slate-300 rounded-full flex items-center justify-center font-bold text-slate-700 text-lg transition"
                  >
                    ✕
                  </button>
                </div>
              </div>

              {/* Modal Body: Transactions List (Sorted Newest First) */}
              <div className="p-5 overflow-y-auto space-y-3 flex-1">
                {sortedCurrentTransactions
                  .filter(t => t.envelopeId === selectedEnvelope.id)
                  .map((txn) => (
                    <div key={txn.id} className="p-4 rounded-2xl border border-slate-100 bg-slate-50/50 flex flex-col gap-2">
                      <div className="flex justify-between items-center">
                        <div>
                          <div className="font-extrabold text-slate-800 text-base flex items-center gap-2">
                            {txn.merchant}
                            
                            {/* 1. Purple Installment Badge */}
                            {txn.isInstallment && (
                              <span className="bg-purple-100 text-purple-800 text-[11px] px-2.5 py-0.5 rounded-full font-extrabold border border-purple-200">
                                תשלום {txn.currentInstallment} מתוך {txn.totalInstallments}
                              </span>
                            )}
                          </div>
                          <div className="text-xs text-slate-400 mt-0.5">{txn.date} • {txn.card}</div>
                        </div>
                        <div className="text-lg font-black text-slate-900">
                          {formatILS(txn.amount)}
                        </div>
                      </div>

                      {/* 10. Editable Category & 5. Note Field */}
                      <div className="grid grid-cols-2 gap-2 mt-2 pt-2 border-t border-slate-200/60 text-xs">
                        <div>
                          <label className="text-[10px] text-slate-400 font-bold block mb-1">קטגוריה:</label>
                          <select 
                            value={txn.category} 
                            onChange={(e) => handleUpdateTxnField(txn.id, 'category', e.target.value)}
                            className="w-full bg-white border border-slate-200 rounded-lg p-1.5 font-semibold text-slate-700"
                          >
                            {DEFAULT_CATEGORIES.map(cat => (
                              <option key={cat} value={cat}>{cat}</option>
                            ))}
                          </select>
                        </div>

                        <div>
                          <label className="text-[10px] text-slate-400 font-bold block mb-1">הערה להוצאה:</label>
                          <input 
                            type="text"
                            placeholder="הוסף הערה..."
                            value={txn.note || ""}
                            onChange={(e) => handleUpdateTxnField(txn.id, 'note', e.target.value)}
                            className="w-full bg-white border border-slate-200 rounded-lg p-1.5 text-slate-700"
                          />
                        </div>
                      </div>
                    </div>
                  ))}
              </div>
            </div>
          </div>
        )}

        {/* 6. UNIFIED EXPORT MODAL (Excel & PDF) */}
        {showExportModal && (
          <div className="fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl w-full max-w-md p-6 shadow-2xl relative">
              <button onClick={() => setShowExportModal(false)} className="absolute top-4 left-4 text-slate-400 hover:text-slate-600 font-bold">✕</button>
              <h3 className="text-lg font-black text-slate-800 mb-4 text-center">בחר פורמט לייצוא דוח</h3>
              <div className="grid grid-cols-2 gap-4">
                <button 
                  onClick={() => {
                    alert("מייצא קובץ Excel מותאם...");
                    setShowExportModal(false);
                  }}
                  className="bg-emerald-50 border-2 border-emerald-500 text-emerald-800 font-bold p-4 rounded-2xl hover:bg-emerald-100 flex flex-col items-center gap-2"
                >
                  <span className="text-2xl">📊</span>
                  <span>ייצוא ל-Excel</span>
                </button>

                <button 
                  onClick={() => {
                    alert("מייצא קובץ PDF מעוצב...");
                    setShowExportModal(false);
                  }}
                  className="bg-red-50 border-2 border-red-500 text-red-800 font-bold p-4 rounded-2xl hover:bg-red-100 flex flex-col items-center gap-2"
                >
                  <span className="text-2xl">📄</span>
                  <span>ייצוא ל-PDF</span>
                </button>
              </div>
            </div>
          </div>
        )}

        {/* 4. FORECAST / MANUAL ADD MODAL */}
        {showForecastModal && (
          <div className="fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl w-full max-w-md p-6 shadow-2xl relative">
              <button onClick={() => setShowForecastModal(false)} className="absolute top-4 left-4 text-slate-400 hover:text-slate-600 font-bold">✕</button>
              <h3 className="text-lg font-black text-slate-800 mb-4">הוספת הוצאה / צפי חדש</h3>
              
              <div className="space-y-3 text-xs">
                <div>
                  <label className="font-bold text-slate-600 block mb-1">שם העסק:</label>
                  <input 
                    type="text" 
                    value={forecastForm.merchant}
                    onChange={(e) => setForecastForm({...forecastForm, merchant: e.target.value})}
                    className="w-full border border-slate-200 rounded-xl p-2.5 text-sm" 
                  />
                </div>

                <div>
                  <label className="font-bold text-slate-600 block mb-1">סכום (₪):</label>
                  <input 
                    type="number" 
                    value={forecastForm.amount}
                    onChange={(e) => setForecastForm({...forecastForm, amount: e.target.value})}
                    className="w-full border border-slate-200 rounded-xl p-2.5 text-sm" 
                  />
                </div>

                <div>
                  <label className="font-bold text-slate-600 block mb-1">משוייך למעטפה:</label>
                  <select 
                    value={forecastForm.envelopeId}
                    onChange={(e) => setForecastForm({...forecastForm, envelopeId: e.target.value})}
                    className="w-full border border-slate-200 rounded-xl p-2.5 text-sm"
                  >
                    {envelopes.map(e => (
                      <option key={e.id} value={e.id}>{e.name}</option>
                    ))}
                  </select>
                </div>

                <button 
                  onClick={() => {
                    if(!forecastForm.merchant || !forecastForm.amount) return alert("נא למלא סכום ושם עסק");
                    setTransactions(prev => [...prev, {
                      id: `manual_${Date.now()}`,
                      ...forecastForm,
                      amount: Number(forecastForm.amount),
                      yearMonth: currentYM,
                      isInstallment: false,
                      currentInstallment: 1,
                      totalInstallments: 1,
                      card: "ידני"
                    }]);
                    setShowForecastModal(false);
                    alert("ההוצאה נוספה בהצלחה!");
                  }}
                  className="w-full bg-amber-500 text-white font-bold p-3 rounded-xl hover:bg-amber-600 text-sm mt-2"
                >
                  שמור הוצאה
                </button>
              </div>
            </div>
          </div>
        )}

        {/* 9. CATEGORY PIE CHART MODAL */}
        {showChartModal && (
          <div className="fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl w-full max-w-md p-6 shadow-2xl relative">
              <button onClick={() => setShowChartModal(false)} className="absolute top-4 left-4 text-slate-400 hover:text-slate-600 font-bold">✕</button>
              <h3 className="text-lg font-black text-slate-800 mb-4 text-center">התפלגות הוצאות במעטפה</h3>
              <canvas id="categoryPieChart" width="300" height="300"></canvas>
            </div>
          </div>
        )}

        {/* Quick Version Reload Bar */}
        <div className="fixed bottom-3 left-1/2 -translate-x-1/2 z-40">
          <button 
            onClick={() => window.location.reload(true)} 
            className="bg-slate-900/90 hover:bg-slate-900 text-white text-[11px] px-4 py-1.5 rounded-full shadow-lg border border-slate-700 backdrop-blur-sm"
          >
            גרסה v1.2 🔄 (רענון מהיר)
          </button>
        </div>

      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>

</body>
</html>
